name: Publicar imagen

# Se publica al crear un tag de historia (hu-01, hu-02, ...) o a mano desde la pestaña Actions.
on:
  push:
    tags: ['hu-*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pruebas:
    name: Pruebas de la API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  publicar:
    name: Construir y publicar en ghcr.io
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de la imagen (ghcr.io exige minúsculas)
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aurora-vida" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEN }}
          # tag hu-01 → imagen :hu-01 y además :latest
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Aurora Vida API
            org.opencontainers.image.description=API de Aurora Vida para el semillero QE

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Resumen
        run: |
          {
            echo "### Imagen publicada"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
